name: Actualizar catálogo piloto

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogo-anttonela-piloto
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CATALOG_URL: https://piloto.catalogo-anttonela.pages.dev/
      CATALOG_PHOTO_CACHE: .cache/catalogo-piloto-webp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/catalogo-piloto-webp
          key: catalogo-piloto-webp-v1-${{ github.run_id }}
          restore-keys: catalogo-piloto-webp-v1-
      - name: Preparar catálogo con las prendas publicadas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/catalog-pilot/build.cjs . .catalogo-piloto
      - name: Confirmar que el enlace de prueba exige autorización
        if: vars.CATALOG_PILOT_PUBLISH == 'true'
        run: |
          redirect="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{redirect_url}' "$CATALOG_URL")"
          node -e 'const u = new URL(process.argv[1]); if (u.protocol !== "https:" || !u.hostname.endsWith(".cloudflareaccess.com") || !u.pathname.startsWith("/cdn-cgi/access/login")) throw Error("El enlace piloto no exige iniciar sesión.");' "$redirect"
      - name: Publicar únicamente en la rama piloto
        if: vars.CATALOG_PILOT_PUBLISH == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module -e '
            const id = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!id || !token) throw Error("Faltan las credenciales de Cloudflare Pages.");
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(id)}/pages/projects/catalogo-anttonela`,
              { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(15000) }
            );
            if (!response.ok) throw Error("No se pudo verificar el proyecto de Cloudflare.");
            const { result } = await response.json();
            if (result?.production_branch !== "main") throw Error("La rama de producción debe ser main.");
          '
          npx --yes wrangler@4.165.0 pages deploy .catalogo-piloto --project-name catalogo-anttonela --branch piloto
